# Completeness as a function of apparent magnitude C(V), V = M_V + DM(d) (no extinction),
# fitted with the per-cluster phase likelihood on all clusters. Anchor: brightest-V bin complete.
seed: 20261011
output_dir: outputs/cv
plots_dir: plots
cache_dir: outputs/cache
catalog_config: configs/default.yaml

n_min_v: 20                 # equal-count bins in observed V (>= 20 GCs each)
n_classes: 3                # for the comparison with free per-class C(d) fits
n_min_d: 15
d_hi: 150.0
orbits: {integration_time_gyr: 5.0, n_samples: 500}
n_bootstrap: 200

mock:
  n_realisations: 100
  n_bootstrap: 100
  n_true: 250
  proxy_tests: true          # also fit C_V(V) * g(x) with x = |b| or the 2D sightline column
  gclf: [-7.4, 1.2]
  density: {type: broken_power_law, alpha: 2.0, beta: 4.0, rb: 5.0, rc: 0.3}
  r_trunc: 1000.0
  completeness: {V_lim: 8.0, dM: 0.5}        # true C = logistic(M_V - (V_lim - DM)) -> a function of V
  scenarios:
    A_C_of_V: {}
    B_latitude: {b_term: {depth: 0.7, b0: 5.0}}
    C_sgr_clump: {clump: {n: 15, xyz: [17.5, 2.5, -6.5], vxyz: [237.9, -24.3, 209.0], sig_x: 1.0, sig_v: 10.0}}
    D_not_V: {not_V: {V0: 4.0, slope: 0.6}}   # C depends on M_V and d but not through V alone
    E_dust: {dust: {a0: 1.0, h_R: 3.0, h_z: 0.1}}   # true C(V + A_V), A_V from an exponential dust disc
    F_two_survey: {C_shape: two_survey}         # C(V) = 0.8 logistic(8, 0.3) + 0.2 logistic(13, 0.3)
    G_power_tail: {C_shape: power_tail}         # C(V) = 1 for V < 7, (1 + V - 7)^-2 beyond
vmax_M_ref: -8.0             # 1/V_max orbit population: clusters with M_V < vmax_M_ref

# Direction-dependent C (scripts/run_cv.py --mode mock_region; real data: summary["region"]).
# Region 1 = inner window |l| < 30 deg, |b| < 15 deg (fixed before fitting); region 0 = rest (anchor).
region_window: [30.0, 15.0]
mock_region:
  n_realisations: 100
  n_bootstrap: 50
  window: [30.0, 15.0]
  scenarios:
    A_C_of_V: {}                                                    # null: no direction effect
    F_two_survey: {C_shape: two_survey}                             # null with a non-logistic C(V)
    H_window_shape: {window: {L: 30.0, B: 15.0, V_lim_in: 6.0}}     # shallower limit inside the window
    I_window_factor: {window: {L: 30.0, B: 15.0, factor: 0.5}}      # constant factor inside the window
    J_window_mismatch: {window: {L: 60.0, B: 25.0, V_lim_in: 6.5}}  # direction effect NOT matching the fitted window
    B_latitude: {b_term: {depth: 0.7, b0: 5.0}}                     # latitude band at all l
    E_dust: {dust: {a0: 1.0, h_R: 3.0, h_z: 0.1}}                   # dust disc, true A_V supplied
    C_sgr_clump: {clump: {n: 15, xyz: [17.5, 2.5, -6.5], vxyz: [237.9, -24.3, 209.0], sig_x: 1.0, sig_v: 10.0}}
  n_min_coarse: 40     # control: single spline with ~3 nodes (matched to one region of 'sep')
  n_min_fine: 10       # control: separate splines with ~4-6 nodes per region

# Faint-end estimator study (scripts/faint_audit.py: real data; scripts/mock_faint.py: calibration mocks).
# Pre-specified BEFORE any run (2026-10-10); not to be changed after looking at validation results.
faint:
  M_faint: -6.5            # faint = M_V >= M_faint (real) / M_V > M_faint (mocks; identical for continuous M)
  M_bright_ref: -8.0       # bright reference population for 1/V_max: M_V < M_bright_ref
  R_real: 0.85             # observed R = faint(1/V_max) / faint(1/q), maps high bracket (from run_cv.py)
  tail_variants:           # spline tail: slope beyond last node = tail x last-segment slope
    T0_baseline: {tail: 1.0}
    T1_extra_node: {tail: 1.0, extra_node_pct: 97.5}    # add a node at the 97.5th percentile of observed V
    T2_flat_tail: {tail: 0.0}                           # C constant beyond the last node
    T3_steep_tail: {tail: 2.0}                          # twice the last-segment slope
  kernel_sigma: 1.0        # luminosity-matched 1/V_max: Gaussian kernel in M_V [mag] on the 1/q-weighted population
  n_boot: 200
  # acceptance on VALIDATION mocks (per estimator, per scenario where its assumptions hold):
  tol_total_median_ln: 0.10      # |median ln(N_corr/N_true)| for totals
  tol_faint_median_ln: 0.15      # same for faint counts
  coverage_band: [0.59, 0.77]    # 68% +- 2 binomial sigma for 100 validation realisations
  mock:
    # Design revised 2026-10-10 after a detection-count smoke test only (no estimator results seen):
    # the logistic V_lim = 8 truth gave 2-11 faint detections vs 55 real. Main scenarios now use the C(V)
    # fitted to the real data (maps, high bracket) as the truth, and a GCLF / N_true giving ~165 detected
    # with ~33% faint in the null, as observed. Logistic and power-law truths are misspecification controls.
    real_spline_from: real_cv_summary_map_high.json
    gclf: [-6.8, 1.5]
    n_true: 252
    n_calib: 100
    n_valid: 100
    n_boot: 60
    # orbit trend: break radius rb x s^0, s^0.5, s^1 for the bright, mid and faint classes; s = 1 is the null
    classes_M: [-8.0, -6.5]      # bright < -8 <= mid < -6.5 <= faint
    scenarios:
      N0_real: {s: 1.0, C_shape: real_spline}
      N0_real_dust: {s: 1.0, C_shape: real_spline, dust: {a0: 1.0, h_R: 3.0, h_z: 0.1}}
      N0_logistic: {s: 1.0}                                  # control: harsh logistic truth (V_lim = 8)
      N0_powertail: {s: 1.0, C_shape: power_tail}            # control: tail shape not log-linear
      T2_real: {s: 2.0, C_shape: real_spline}                # faint class rb x2, mid x sqrt(2), bright x1
      T4_real: {s: 4.0, C_shape: real_spline}
      T4_real_dust: {s: 4.0, C_shape: real_spline, dust: {a0: 1.0, h_R: 3.0, h_z: 0.1}}
